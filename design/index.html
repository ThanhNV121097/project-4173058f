<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hello-word-28 design</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #ffffff;
      --text: #000000;
      --muted: #666666;
      --line: #e5e5e5;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--bg);
      color: var(--text);
    }
    main {
      display: grid;
      gap: 0;
    }
    section {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      border-bottom: 1px solid var(--line);
    }
    .card {
      width: 100%;
      max-width: 760px;
      min-height: 220px;
      display: grid;
      place-items: center;
      text-align: center;
    }
    .word {
      font-size: clamp(2rem, 6vw, 4.5rem);
      line-height: 1.1;
      font-weight: 400;
      letter-spacing: -0.04em;
    }
    .label {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 0.875rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
    }
    .frame {
      position: relative;
      width: min(100%, 960px);
      border: 1px solid var(--line);
      border-radius: 20px;
      background: #fff;
      box-shadow: 0 1px 0 rgba(0,0,0,0.02);
      overflow: hidden;
    }
    .status {
      color: var(--muted);
      font-size: 1.125rem;
    }
    .tiny {
      display: block;
      margin-top: 10px;
      font-size: 0.875rem;
      color: var(--muted);
    }
    @media (max-width: 640px) {
      section { min-height: 80vh; }
      .frame { border-radius: 16px; }
    }
  </style>
</head>
<body>
  <main>
    <section id="loaded" aria-labelledby="loaded-title">
      <div class="frame" role="img" aria-label="Loaded greeting state">
        <div class="label">Loaded</div>
        <div class="card">
          <h1 class="word" id="loaded-title">Hello Word</h1>
        </div>
      </div>
    </section>

    <section id="loading" aria-labelledby="loading-title">
      <div class="frame" role="img" aria-label="Loading greeting state">
        <div class="label">Loading</div>
        <div class="card">
          <div>
            <div class="word" id="loading-title">Hello Word</div>
            <span class="tiny">Loading stored greeting…</span>
          </div>
        </div>
      </div>
    </section>

    <section id="error" aria-labelledby="error-title">
      <div class="frame" role="img" aria-label="Error greeting state">
        <div class="label">Error</div>
        <div class="card">
          <div>
            <div class="word" id="error-title">Hello Word</div>
            <span class="tiny">Could not read greeting row.</span>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
